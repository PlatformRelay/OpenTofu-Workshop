site_name: OpenTofu Practitioner Workshop
site_description: Free, open-source OpenTofu workshop — Slidev decks, LocalStack labs, and PDFs.
site_url: https://platformrelay.github.io/OpenTofu-Workshop/
repo_url: https://github.com/PlatformRelay/OpenTofu-Workshop
repo_name: PlatformRelay/OpenTofu-Workshop
copyright: Copyright &copy; 2026 Platform Relay — 0BSD License

docs_dir: docs
site_dir: site
strict: true

validation:
  # Labs / slides / setup live outside docs_dir; GitHub absolute links are intentional.
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

# Keep agent/coordination and pin files out of the published site.
exclude_docs: |
  decisions/**
  requirements-docs.txt

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PlatformRelay/OpenTofu-Workshop

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Run the slides locally: run-slides.md
      - Local toolchain & LocalStack: setup.md
  - Curriculum:
      - Syllabus: syllabus.md
      - Facilitator runbook: facilitator-runbook.md
  - Labs: labs.md
  - Downloads & previews:
      - Live decks & PDFs: downloads.md
  - Project:
      - Associate alignment: associate-alignment.md
      - Release process: release.md
      - Supply-chain policy: security/supply-chain.md
