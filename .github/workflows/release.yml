name: Release

# Runs ONLY on version tags (e.g. `v1.2.0`). Exports the two delivery decks —
# the full superset and the canonical 3-day cut — to PDF and attaches them to a
# GitHub Release. Ordinary pushes never release; cut a release by tagging:
#
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the PDF assets

env:
  CI: "true"

jobs:
  release:
    name: Export PDFs and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        # The browser binary itself is fetched by playwright-chromium's
        # postinstall; this adds the OS libraries slidev export needs headless.
        run: pnpm exec playwright install-deps chromium

      - name: Export decks to PDF
        # slidev appends `.pdf`; GITHUB_REF_NAME is the tag (e.g. v1.2.0).
        # VITE_WORKSHOP_* stamp tag + short SHA into global-bottom chrome
        # (US-P-FOOT); vite.config.mjs also falls back to GITHUB_* / git.
        env:
          VITE_WORKSHOP_VERSION: ${{ github.ref_name }}
          VITE_WORKSHOP_SHA: ${{ github.sha }}
        run: |
          pnpm exec slidev export slides.md \
            --output "opentofu-workshop-full-${GITHUB_REF_NAME}"
          pnpm exec slidev export slides-3day.md \
            --output "opentofu-workshop-3day-${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            opentofu-workshop-full-*.pdf
            opentofu-workshop-3day-*.pdf
          fail_on_unmatched_files: true
          generate_release_notes: true
