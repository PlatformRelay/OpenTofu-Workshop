name: CI

# Fast gate on every PR and every push to main: lint the labs and build all
# three root decks so a broken deck or malformed lab fails review. PDF export
# (slow, needs a headless browser) is intentionally left to the release job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Slidev + pnpm must run non-interactively; pnpm 11 otherwise prompts on its
  # dependency-build allowlist. (GitHub Actions also sets CI=true itself.)
  CI: "true"

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# Every job here only checks out the repo and lints/builds/tests — none push,
# comment, deploy, or otherwise mutate the repo — so read-only contents access
# is all any of them needs. Pages deploy and release live in their own
# workflows with their own (wider) scopes; this cap does not touch them.
permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and enforce repository supply-chain policy
        run: |
          node --test scripts/supply-chain-policy.test.mjs scripts/pnpm-overrides.test.mjs
          node scripts/supply-chain-policy.mjs

  lint:
    name: Lint labs (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:provenance
      - run: pnpm test:showcase

  lab-contract:
    name: Lab sibling-solution contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Zero-dependency Node script - no pnpm install needed. Mirrors link-check.
      - run: node --test scripts/lab-contract-ci.test.mjs
      - run: node scripts/lab-contract.mjs

  link-check:
    name: Link-check docs and labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Zero-dependency Node script — no pnpm install needed. Fails on a missing
      # internal target, a broken relative anchor, or an unresolved <pages-url>.
      - run: node --test scripts/link-check.test.mjs
      - run: node scripts/link-check.mjs

  pages-contract:
    name: Pages site contract (MkDocs + /deck/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: MkDocs strict build (nav drift fails before merge)
        run: |
          python -m pip install -r docs/requirements-docs.txt
          mkdocs build --strict
      - name: Assert pages.yml / pages-build / mkdocs wiring and front-door links
        run: |
          node --test scripts/pages-site.test.mjs scripts/readme-front-door.test.mjs
          node --test scripts/slide-overflow.test.mjs

  # Blocking (US-F-DEP-AUDIT): fails on any high/critical advisory that is not
  # covered by an unexpired entry in supply-chain/exceptions.json, and fails
  # closed when the audit data itself is missing, empty, or malformed.
  # Moderate/low findings are reported but never block.
  audit:
    name: Dependency audit (high/critical, fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dep-audit
      - name: pnpm audit (high/critical gate)
        # `pnpm audit` exits non-zero whenever it finds ANY advisory, including
        # the moderate/low ones we do not block on, and GitHub runs `run:` under
        # `bash -e -o pipefail` — so piping it straight into the gate would fail
        # the step on the audit's own exit code before the gate had a verdict.
        # Capture first, then decide. Deliberately NOT `|| true`: a crashed or
        # empty audit leaves an unusable file and the gate fails closed on it,
        # which is exactly the behaviour we want.
        run: |
          set +e
          pnpm audit --json > "$RUNNER_TEMP/pnpm-audit.json"
          set -e
          node scripts/npm-audit-gate.mjs "$RUNNER_TEMP/pnpm-audit.json"

  build:
    name: Build root decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium system dependencies
        # pages-nav Playwright regression (hash+base slide navigation) needs
        # the same OS libs as slidev export / showcase-gif.
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run test:deck
      - run: node --test scripts/pages-nav.test.mjs
      - run: pnpm run decks:check
      - name: Build superset, day decks, 3-day cut, and templates gallery
        run: |
          pnpm run build
          pnpm run build:day1
          pnpm run build:day2
          pnpm run build:day3
          pnpm run build:3day
          pnpm run build:templates

  shell:
    name: Shell scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Shellcheck tracked shell scripts
        run: git ls-files '*.sh' | xargs shellcheck -S warning
      - name: Run bats tests (mocked binaries — no docker/network)
        run: bats tests/shell

  verify-unit:
    name: Verify modules (fmt · validate · tofu test — mock/plan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PINNED (US-P-PINS): tofu_version must match versions.env — verify.sh §10 drift-checks.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.10.3"
      - name: Bootstrap contract · fmt · validate · test (no cloud)
        # Unit lane. DISCOVERED, not enumerated: every `scripts/*-selftest.sh`
        # runs, then `scripts/verify.sh` (fmt-check, validate, and `tofu test`
        # in plan/mock across modules/examples — integration suites run in
        # verify-integration below).
        #
        # WHY a glob and not a list: the previous hand-written enumeration meant
        # a self-test added later silently never ran here, so a PR could
        # reintroduce the very regression that self-test was written to prevent
        # and still show green. Discovery makes a new `*-selftest.sh` gate CI
        # the moment it lands — no CI edit, nothing to forget.
        #
        # This is a SUPERSET of the local `task verify` list, not a mirror of
        # it: that list is hand-maintained in Taskfile.yaml and may lag. Do not
        # re-describe this block as "the same gate as `task verify`".
        #
        # ORDERING: verify-selftest.sh must run BEFORE verify.sh (see the
        # release-self-test note in scripts/verify-selftest.sh). That holds
        # because the whole discovery loop precedes verify.sh — NOT because of
        # collation. Keep verify.sh after the loop.
        run: |
          set -euo pipefail
          # Fixed collation so discovery order is identical on every runner.
          export LC_ALL=C
          # nullglob: an unmatched glob otherwise expands to the LITERAL
          # pattern, and the loop below would run `bash 'scripts/*-selftest.sh'`.
          # Measured, that is NOT a silent green — it exits 127 and GHA's
          # `bash -e {0}` reds the step. What it does not do is say WHY: the log
          # reads `bash: scripts/*-selftest.sh: No such file or directory`,
          # which looks like a deleted script rather than "discovery matched
          # nothing", and it only reds at all because the loop body happens to
          # be a command that fails on a missing file. With nullglob the array
          # is simply empty, and the check below turns that into a named
          # ::error:: that does not depend on what the loop body is.
          shopt -s nullglob
          selftests=(scripts/*-selftest.sh)
          shopt -u nullglob
          if [ "${#selftests[@]}" -eq 0 ]; then
            echo "::error::self-test discovery matched no scripts/*-selftest.sh."
            echo "::error::The unit lane would have certified nothing. Refusing to report green."
            exit 1
          fi
          echo "Discovered ${#selftests[@]} self-test(s):"
          printf '  %s\n' "${selftests[@]}"
          for selftest in "${selftests[@]}"; do
            echo "::group::${selftest}"
            bash "${selftest}"
            echo "::endgroup::"
          done
          bash scripts/verify.sh

  fixture-integrity:
    name: Fixture integrity (pre-commit must not rewrite the S13 fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PINNED (US-P-PINS): tofu_version must match versions.env — verify.sh §10 drift-checks.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.10.3"
      - name: Install pre-commit
        run: pipx install "pre-commit==4.6.2"
      - name: S13 fixture survives the mutating hooks
        # WHY THIS JOB EXISTS: labs/day-2/13-static-analysis/messy/main.tf is
        # deliberately unformatted — that IS the S13 lesson — and it has already
        # been destroyed once in the wild. `.pre-commit-config.yaml` excludes it
        # from the two mutating hooks, but an exclude is a CLAIM, and this repo
        # has documented cases of a gate certifying something other than what it
        # appears to. So assert it, by mutation.
        #
        # The mutation is the RE-ADMISSION path, not the plain path: the
        # upstream pre-commit-terraform hooks batch by DIRECTORY, so a sibling
        # `.tf` in messy/ re-admits the directory and `tofu fmt` rewrites
        # main.tf even when main.tf itself is excluded. This job plants exactly
        # that sibling. Measured: with a file-exact exclude it fails
        # (13f0af5a… -> d0b767a2…); with the directory-wide one shipped in
        # .pre-commit-config.yaml it passes.
        #
        # Both hooks carry a POSITIVE CONTROL outside the fixture. Without one,
        # an exclude that accidentally matched everything — or a pre-commit that
        # never ran at all — would sail through green.
        #
        # This lives in CI rather than in a local `repo: local` pre-commit hook
        # on purpose: lab 13 Step 1 has learners run `tofu fmt main.tf` on the
        # fixture deliberately, so a local hook asserting cleanliness would
        # false-red them mid-lab.
        env:
          FIXTURE: labs/day-2/13-static-analysis/messy/main.tf
          SIBLING: labs/day-2/13-static-analysis/messy/zz-integrity-probe.tf
          CONTROL_DIR: .fixture-integrity-control
        run: |
          set -euo pipefail
          PCT_TFPATH="$(command -v tofu)"
          export PCT_TFPATH

          fail() { echo "::error::fixture-integrity: $*"; exit 1; }

          # Clean up on EVERY exit, including the failing ones — a gate that
          # leaves a rewritten fixture and stray probes behind hands the next
          # step a second, unrelated failure to debug.
          cleanup() {
            rm -f "$SIBLING" "labs/day-2/13-static-analysis/messy/README.md"
            rm -rf "$CONTROL_DIR"
            git checkout -- "$FIXTURE" 2>/dev/null || true
          }
          trap cleanup EXIT

          before="$(sha256sum "$FIXTURE" | cut -d" " -f1)"

          # Re-admission probe: an unformatted sibling inside the fixture dir.
          printf 'variable "probe" {\n type = string\n  default = "x"\n}\n' >"$SIBLING"
          # Positive control: an identical file OUTSIDE the fixture dir.
          mkdir -p "$CONTROL_DIR"
          printf 'variable "probe" {\n type = string\n  default = "x"\n}\n' >"$CONTROL_DIR/main.tf"

          # --- terraform_fmt -------------------------------------------------
          # `|| true`: the hook legitimately exits non-zero when it rewrites the
          # CONTROL file. The verdict is the bytes below, never the exit code.
          pre-commit run terraform_fmt --files "$FIXTURE" "$SIBLING" "$CONTROL_DIR/main.tf" || true

          after="$(sha256sum "$FIXTURE" | cut -d" " -f1)"
          [ "$before" = "$after" ] || fail "terraform_fmt REWROTE the S13 fixture ($before -> $after). A sibling .tf re-admitted labs/day-2/13-static-analysis/messy/ — the exclude in .pre-commit-config.yaml must stay DIRECTORY-wide."

          # Positive control: the hook must still repair a file elsewhere.
          # If this passes, the exclude is not a repo-wide no-op.
          tofu fmt -check "$CONTROL_DIR/main.tf" >/dev/null 2>&1 \
            || fail "positive control FAILED: terraform_fmt left $CONTROL_DIR/main.tf unformatted, so the hook never really ran and the green above proves nothing"

          # --- terraform_docs ------------------------------------------------
          # This hook WRITES README.md into any directory holding a .tf
          # (--create-file-if-not-exist=true). Assert the fixture directory never
          # reaches it. Deliberately asserting the INPUT FILTER, not the side
          # effect: on --all-files this hook aborts early under labs/day-1/**,
          # which would MASK the write and fake a green.
          docs_fixture="$(pre-commit run terraform_docs --files "$FIXTURE" "$SIBLING" 2>&1 || true)"
          echo "$docs_fixture"
          case "$docs_fixture" in
            *"no files to check"*) : ;;
            *) fail "terraform_docs was handed the S13 fixture directory; it must be filtered out entirely" ;;
          esac
          [ ! -e "labs/day-2/13-static-analysis/messy/README.md" ] \
            || fail "terraform_docs created a README.md inside the S13 fixture directory"

          # Positive control: the same hook must NOT be filtered out elsewhere.
          docs_control="$(pre-commit run terraform_docs --files "$CONTROL_DIR/main.tf" 2>&1 || true)"
          echo "$docs_control"
          case "$docs_control" in
            *"no files to check"*) fail "positive control FAILED: terraform_docs skipped $CONTROL_DIR/main.tf too, so the exclude matches everything and the green above proves nothing" ;;
            *) : ;;
          esac

          # --- cleanup --------------------------------------------------------
          rm -f "$SIBLING"
          rm -rf "$CONTROL_DIR"
          leftover="$(git status --porcelain -- labs/day-2/13-static-analysis/)"
          [ -z "$leftover" ] || fail "this job left the S13 fixture directory dirty: $leftover"
          echo "fixture-integrity: S13 fixture byte-identical ($before); both hooks armed elsewhere."

  verify-integration:
    name: Verify integration (tofu test — LocalStack apply)
    runs-on: ubuntu-latest
    services:
      localstack:
        # PINNED (US-P-PINS / US-F-CI): image tag must match versions.env LOCALSTACK_VERSION.
        # GHA service containers cannot source versions.env — verify.sh §10 drift-checks the literal.
        # 4.9.2 is the last LocalStack community release that boots without a license. The 2026 CalVer
        # images (:latest since ~2026-07) exit code 55 demanding LOCALSTACK_AUTH_TOKEN,
        # which is what broke this job on every push. Bump deliberately in versions.env.
        image: localstack/localstack:4.9.2
        ports: ["4566:4566"]
        env:
          SERVICES: s3,dynamodb,iam,sqs,sns,kms,logs
        # Own health-check (overrides the image's) with a generous start
        # period so a slow boot reads as "starting", never "unhealthy" —
        # the runner waits for healthy before running any step.
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PINNED (US-P-PINS): tofu_version must match versions.env — verify.sh §10 drift-checks.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.10.3"
      - name: Wait for LocalStack readiness
        # Belt-and-braces: the service is already health-gated, but assert the
        # edge port answers from the job side too, and fail loudly if not.
        run: |
          echo "Waiting for http://localhost:4566/_localstack/health ..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "LocalStack is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack did not answer on :4566 within 60s"
          curl -sv http://localhost:4566/_localstack/health || true
          exit 1
      - name: Integration tests against LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
        # One retry per root absorbs transient LocalStack flakiness
        # (first-touch service init); a genuine failure still fails the job.
        # Covers examples/* and labs/day-2/*/tests/integration*.tftest.hcl
        # (e.g. lab 16) — same discovery as Taskfile verify:integration:tests.
        run: |
          for d in examples/* labs/day-2/*; do
            [ -d "$d" ] || continue
            ls "$d"/tests/integration*.tftest.hcl >/dev/null 2>&1 || continue
            echo "::group::$d (integration)"
            ok=0
            for attempt in 1 2; do
              if ( cd "$d" && tofu init -input=false && tofu test -filter=tests/integration.tftest.hcl ); then
                ok=1; break
              fi
              echo "::warning::$d integration tests failed (attempt $attempt/2)"
              [ "$attempt" -lt 2 ] && sleep 10
            done
            echo "::endgroup::"
            [ "$ok" -eq 1 ] || exit 1
          done

  showcase-gif:
    # US-P-GIF: the README's animated deck tour must be reproducible from a
    # clean checkout with zero manual steps. This regenerates it end-to-end
    # (slidev export → per-click PNG frames → sharp GIF assembly) and uploads
    # the result, so a drifted showcase page range or a broken pipeline fails
    # the PR instead of rotting silently. The committed GIF is refreshed by
    # running `pnpm showcase:gif` locally and committing the result. The
    # uploaded artifact is informational only — byte-for-byte parity with the
    # committed file is not enforced yet (soft drift accepted for now).
    name: Render README showcase GIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium system dependencies
        # The browser binary itself is fetched by playwright-chromium's
        # postinstall; this adds the OS libraries slidev export needs headless.
        run: pnpm exec playwright install-deps chromium
      - name: Render the showcase GIF from the deck sources
        run: pnpm showcase:gif
      - name: Upload the rendered GIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-showcase-gif
          path: docs/images/deck-showcase.gif
          if-no-files-found: error
