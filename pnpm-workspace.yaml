shamefullyHoist: true

# pnpm v11 errors on unapproved dependency build scripts, so allowlist the
# ones we rely on: `playwright-chromium` (downloads the browser that
# `slidev export` needs for PDF/PNG/PPTX output) and `sharp` (its install
# script just verifies/falls back from the prebuilt libvips binaries that the
# showcase-GIF assembly uses — scripts/make-showcase-gif.mjs).
allowBuilds:
  playwright-chromium: true
  sharp: true

overrides:
  # GHSA-r28c-9q8g-f849 is fixed in 8.5.18. Keep every transitive Vue/Vite
  # consumer on the current patched PostCSS line until upstream ranges converge.
  postcss: 8.5.25
  # GHSA-pm4m-ph32-ghv5 affects only js-yaml 5.0.0 through 5.2.1. Keep the
  # markdownlint 5.x line patched without forcing its unrelated 3.x/4.x users
  # across a major-version boundary.
  "js-yaml@>=5.0.0 <6.0.0": 5.2.3
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870) hits both the 3.x and 4.x js-yaml
  # lines that @slidev/cli pulls in transitively. The fix was released on each
  # line separately, so pin each range to its own first patched version rather
  # than dragging Slidev's YAML parser across a major-version boundary.
  # GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not bound CPU for empty merge
  # sources) was again fixed per line: 4.3.2 and 3.15.2.
  "js-yaml@>=4.0.0 <5.0.0": 4.3.2
  "js-yaml@>=3.0.0 <4.0.0": 3.15.2
  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv: nanoid generators can loop
  # indefinitely. GHSA-2v37-7h3g-55p8 was re-scored to `<3.3.18`, so the old
  # 3.3.17 floor was still inside the vulnerable range; 3.3.18 is the first
  # patched 3.x release. postcss pulls that line transitively.
  "nanoid@>=3.0.0 <4.0.0": 3.3.18
  # monaco-editor / mermaid pull older DOMPurify; pin the patched line.
  dompurify: 3.4.13
  # Five mermaid advisories first patched in 11.16.1 (DoS / prototype pollution /
  # sibling CSS injection). The deck only uses flowchart and stateDiagram-v2.
  mermaid: 11.16.1
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895: unbounded expansion DoS.
  # Lockfile currently has 2.1.2 and 5.0.7; pin each line to its patched floor.
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.4
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.9
  # GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (backslash authority, fixed in
  # 3.1.5) plus GHSA-jqff-g426-hqxp / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf /
  # GHSA-5jgf-p345-68v8 (host confusion + SSRF via percent-decoding, IPv6 and
  # IDN normalisation, fixed in 3.1.6). This pin is what Dependabot cannot move
  # ("security_update_not_possible"), so bump it here when the next advisory lands.
  "fast-uri@>=3.0.0 <4.0.0": 3.1.6
  # GHSA-mwp4-54f8-5fhr: Address4 leading-zero octet decode mismatch.
  ip-address: 10.3.1
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: unbounded cache growth and a
  # prototype write via custom stats, both fixed in 4.28.7. Reached only through
  # Babel/PostCSS inside the Slidev build; pin the 4.x line to a patched floor
  # instead of letting `pnpm update` re-resolve the whole build toolchain.
  "browserslist@>=4.0.0 <5.0.0": 4.28.8
  # GHSA-8j4g-w8fx-2239 / GHSA-54fx-42gc-7vw4 / GHSA-f23p-vx2j-j53r /
  # GHSA-79qm-7rj5-m7r9 (hono: CORS ReDoS, language-middleware DoS, memo() SSR
  # leak, proxy Connection headers) fixed in 4.12.34, and GHSA-frvp-7c67-39w9
  # (@hono/node-server serve-static traversal on Windows) fixed in 1.19.15.
  # Both arrive via @modelcontextprotocol/node inside @slidev/cli, which pins
  # exact versions, so only an override can move them.
  # GHSA-g6gw-c38x-mqfc / GHSA-crvj-82cr-hjcx / GHSA-gqvv-2mrq-wpjv (hono:
  # parseBody() dot-notation nesting memory exhaustion, query parser reading
  # past the URL fragment, incomplete toSSG() path-traversal fix) raise the
  # hono floor to 4.13.5.
  "hono@>=4.0.0 <5.0.0": 4.13.5
  "@hono/node-server@>=1.0.0 <2.0.0": 1.19.15
  # GHSA-7w5x-hrqm-74c2: smol-toml DoS via malformed TOML, fixed in 1.7.1.
  # markdownlint-cli2 pins smol-toml exactly (1.7.0, still so in its latest
  # release), so only an override can move it. Bounded to the 1.x line.
  "smol-toml@>=1.0.0 <2.0.0": 1.7.1

# pnpm 11 minimumReleaseAge gate: allow this override pin through when fresh
# on the registry.
minimumReleaseAgeExclude:
  - 'nanoid@3.3.18'
