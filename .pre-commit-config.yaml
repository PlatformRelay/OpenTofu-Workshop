# .pre-commit-config.yaml — local quality gate for the workshop repo.
#
# Install once:  pipx install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# OpenTofu-first: the pre-commit-terraform hooks honor the PCT_TFPATH env var to
# select the binary. Export it so every hook shells out to `tofu`, never
# `terraform`:
#
#   export PCT_TFPATH="$(command -v tofu)"
#   pre-commit run --all-files
#
# (`entry`/`language` on a remote hook are NOT user-overridable, so PCT_TFPATH is
# the supported OpenTofu switch. `default_language_version` below documents it.)
minimum_pre_commit_version: "3.5.0"

# The S13 static-analysis fixture is DELIBERATELY non-canonical — being
# unformatted IS its lesson (labs/day-2/13-static-analysis.md), and it is the
# only non-canonical tracked .tf in the repo. Every REWRITING hook must skip it,
# or `pre-commit run --all-files` (documented above as the way to run this file)
# silently destroys the exercise.
#
# `exclude:` is a Python `re` pattern matched against repo-relative paths — not
# a shell glob, hence the escaped dot and the anchors. Keep it FILE-exact: a
# directory-wide `.../messy/` pattern would also exempt a future
# `messy/adjacent.tf`, which scripts/verify-selftest.sh explicitly requires to
# stay gated. Same path as S13_MESSY_FIXTURE in scripts/verify.sh — if you
# change one, change all of them together.
#
# The pattern is repeated per hook rather than shared via a YAML anchor: an
# anchor needs a top-level key, and pre-commit prints
# "[WARNING] Unexpected key(s) present at root" for anything it does not know —
# on every run, in a repo learners run this in.
#
#   S13 fixture exclude:  ^labs/day-2/13-static-analysis/messy/main\.tf$

repos:
  # --- OpenTofu / Terraform hooks -------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
        name: tofu fmt
        # Honors PCT_TFPATH → runs `tofu fmt`. See header note.
        files: \.tf$
        # MUTATOR: `tofu fmt` rewrites in place. Without this it reformats the
        # S13 fixture on every `pre-commit run --all-files`.
        exclude: ^labs/day-2/13-static-analysis/messy/main\.tf$

      - id: terraform_tflint
        name: tflint
        args:
          - "--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"

      - id: terraform_docs
        name: terraform-docs (module READMEs)
        # MUTATOR: `--create-file-if-not-exist=true` makes this hook WRITE a
        # README.md into every directory holding a .tf file. Verified: without
        # this exclude it creates labs/day-2/13-static-analysis/messy/README.md,
        # leaving the fixture dirty in `git status` — which lab 13's cleanup
        # step and lab 28 both rely on being empty. Excluding the fixture's only
        # .tf removes the directory from the hook's input entirely.
        exclude: ^labs/day-2/13-static-analysis/messy/main\.tf$
        args:
          - "--hook-config=--path-to-file=README.md"
          - "--hook-config=--add-to-existing-file=true"
          - "--hook-config=--create-file-if-not-exist=true"

  # --- Secrets scanning ------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  # --- Generic hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
