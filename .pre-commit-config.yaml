# .pre-commit-config.yaml — local quality gate for the workshop repo.
#
# Install once:  pipx install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# OpenTofu-first: the pre-commit-terraform hooks honor the PCT_TFPATH env var to
# select the binary. Export it so every hook shells out to `tofu`, never
# `terraform`:
#
#   export PCT_TFPATH="$(command -v tofu)"
#   pre-commit run --all-files
#
# (`entry`/`language` on a remote hook are NOT user-overridable, so PCT_TFPATH is
# the supported OpenTofu switch. `default_language_version` below documents it.)
minimum_pre_commit_version: "3.5.0"

# The S13 static-analysis fixture is DELIBERATELY non-canonical — being
# unformatted IS its lesson (labs/day-2/13-static-analysis.md), and it is the
# only non-canonical tracked .tf in the repo. Every REWRITING hook must skip it,
# or `pre-commit run --all-files` (documented above as the way to run this file)
# silently destroys the exercise.
#
# `exclude:` is a Python `re` pattern matched against repo-relative paths — not
# a shell glob, hence the escaped dots and the `^` anchor.
#
# The pattern is DIRECTORY-wide, not file-exact, because the upstream
# pre-commit-terraform hooks BATCH BY DIRECTORY: they map the surviving file
# list to the set of directories containing those files and hand tofu the
# DIRECTORY. A file-exact `.../messy/main\.tf$` therefore protects the fixture
# only as long as `messy/` holds nothing else — add any sibling `.tf` and the
# directory is re-admitted and `tofu fmt` rewrites `main.tf` anyway. Measured
# on this repo, with the file-exact pattern in place:
#
#   messy/ = main.tf only        -> 13f0af5a … 13f0af5a   (safe)
#   messy/ = main.tf + sibling   -> 13f0af5a … d0b767a2   (DESTROYED)
#
# Nothing is lost by widening it. pre-commit's `exclude:` and scripts/verify.sh
# are INDEPENDENT scans: verify.sh walks git-tracked `.tf` itself and skips
# only S13_MESSY_FIXTURE (verify.sh:211), so a future `messy/adjacent.tf` stays
# gated THERE — that is what scripts/verify-selftest.sh:958,969 assert, against
# verify.sh, not against this file. Widening here cannot un-gate it.
#
# The directory path is a prefix of S13_MESSY_FIXTURE in scripts/verify.sh — if
# the fixture ever moves, change both together.
#
# The pattern is repeated per hook rather than shared via a YAML anchor: an
# anchor needs a top-level key, and pre-commit prints
# "[WARNING] Unexpected key(s) present at root" for anything it does not know —
# on every run, in a repo learners run this in.
#
#   S13 fixture exclude:  ^labs/day-2/13-static-analysis/messy/
#
# ENFORCED, not merely documented: the `fixture-integrity` job in
# .github/workflows/ci.yml re-adds a sibling `.tf` to `messy/` and fails unless
# `main.tf` comes back byte-identical — with positive controls proving the
# hooks are still armed everywhere else.

repos:
  # --- OpenTofu / Terraform hooks -------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
        name: tofu fmt
        # Honors PCT_TFPATH → runs `tofu fmt`. See header note.
        files: \.tf$
        # MUTATOR: `tofu fmt` rewrites in place. Without this it reformats the
        # S13 fixture on every `pre-commit run --all-files`. Directory-wide —
        # see the header: a file-exact pattern is re-admitted by any sibling.
        exclude: ^labs/day-2/13-static-analysis/messy/

      - id: terraform_tflint
        name: tflint
        args:
          - "--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"

      - id: terraform_docs
        name: terraform-docs (module READMEs)
        # MUTATOR: `--create-file-if-not-exist=true` makes this hook WRITE a
        # README.md into every directory holding a .tf file. Verified without
        # this exclude via `pre-commit run terraform_docs --files <fixture>`:
        # it creates labs/day-2/13-static-analysis/messy/README.md, leaving the
        # fixture dirty in `git status` — which lab 13's cleanup step and lab 28
        # both rely on being empty.
        #
        # `pre-commit run --all-files` happens NOT to reach that write today,
        # because terraform_docs aborts earlier on "Invalid provider reference"
        # under labs/day-1/**. That abort MASKS the write rather than preventing
        # it: fix the day-1 modules and the fixture starts getting a README.
        # The exclude is more justified than the full-run evidence suggests, not
        # less. Directory-wide for the same batching reason as terraform_fmt.
        exclude: ^labs/day-2/13-static-analysis/messy/
        args:
          - "--hook-config=--path-to-file=README.md"
          - "--hook-config=--add-to-existing-file=true"
          - "--hook-config=--create-file-if-not-exist=true"

  # --- Secrets scanning ------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  # --- Generic hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
